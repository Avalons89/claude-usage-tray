[package]
name = "claude-usage"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api lets the strip's window be transparent on macOS.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

# Raises the strip back over the taskbar. Same version as Tauri's, so window.hwnd() fits.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
