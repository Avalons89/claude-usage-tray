name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing the release needs write access.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          # One app for both Apple silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          # The oldest supported Ubuntu, so the packages run on more distros.
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - run: npm ci

      # Every commit on main gets a higher version, so installed copies see it as an update.
      - name: Version from commit count
        shell: bash
        run: node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f));c.version='0.1.'+process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "$(git rev-list --count HEAD)"

      # Builds, signs the update files and adds them and latest.json to the release.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Claude Usage v__VERSION__
          releaseBody: Installers for this build. Installed copies update themselves within the hour.
          args: ${{ matrix.args }}
