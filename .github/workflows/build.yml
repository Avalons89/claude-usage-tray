name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing the release needs write access.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # contabo-build has the Linux libraries, NSIS and LLVM installed system-wide.
          # It cross-compiles the Windows installer, which Tauri marks experimental.
          - runner: [self-hosted, linux, x64]
            args: --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
          # Built on Ubuntu 24.04, so the packages need glibc 2.39 or newer.
          - runner: [self-hosted, linux, x64]
            args: --bundles deb,appimage
          # Only a Mac can build the Mac app. One app for both Apple silicon and Intel.
          - runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      # The server has no FUSE, which the AppImage tools otherwise need.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo-xwin
        if: contains(matrix.args, 'cargo-xwin')
        run: cargo xwin --version || cargo install --locked cargo-xwin

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - run: npm ci

      # Every commit on main gets a higher version, so installed copies see it as an update.
      - name: Version from commit count
        shell: bash
        run: node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f));c.version='0.1.'+process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "$(git rev-list --count HEAD)"

      # Builds, signs the update files and adds them and latest.json to the release.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Claude Usage v__VERSION__
          releaseBody: Installers for this build. Installed copies update themselves within the hour.
          args: ${{ matrix.args }}
