name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          # One app for both Apple silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          # The oldest supported Ubuntu, so the packages run on more distros.
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
