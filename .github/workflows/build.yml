name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing the release needs write access.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # contabo-build has the Linux libraries, NSIS and LLVM installed system-wide.
          # It cross-compiles the Windows installer, which Tauri marks experimental.
          - runner: [self-hosted, linux, x64]
            args: --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
          # Built on Ubuntu 24.04, so the packages need glibc 2.39 or newer.
          - runner: [self-hosted, linux, x64]
            args: --bundles deb,appimage
    # The Mac app builds on Codemagic (codemagic.yaml) into the same release.
    runs-on: ${{ matrix.runner }}
    env:
      # The server has no FUSE, which the AppImage tools otherwise need.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo-xwin
        if: contains(matrix.args, 'cargo-xwin')
        run: cargo xwin --version || cargo install --locked cargo-xwin

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      - run: npm ci

      - name: Version from commit count
        run: node scripts/set-version.mjs

      # Builds, signs the update files and adds them and latest.json to the release.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: Claude Usage v__VERSION__
          releaseBody: Installers for this build. Installed copies update themselves within the hour.
          args: ${{ matrix.args }}
